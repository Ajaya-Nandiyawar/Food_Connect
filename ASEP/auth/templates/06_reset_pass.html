<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="logo" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f8f8f8;
      }

      .container {
        background-color: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        margin: 1rem;
      }

      h2 {
        color: #ff6b00;
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .description {
        color: #666;
        margin-bottom: 1.5rem;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      label {
        color: #555;
        font-size: 0.9rem;
      }

      input {
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: #ff6b00;
      }

      .password-requirements {
        font-size: 0.8rem;
        color: #666;
        margin-top: 0.25rem;
      }

      .requirement {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.25rem;
      }

      .requirement.valid {
        color: #4caf50;
      }

      .requirement.invalid {
        color: #f44336;
      }

      button {
        background-color: #ff6b00;
        color: white;
        padding: 0.8rem;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #e65100;
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .message {
        text-align: center;
        margin-top: 1rem;
        padding: 0.8rem;
        border-radius: 5px;
        display: none;
      }

      .success {
        background-color: #fff3e0;
        color: #e65100;
        border: 1px solid #ffe0b2;
      }

      .error {
        background-color: #fbe9e7;
        color: #d84315;
        border: 1px solid #ffccbc;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 1rem;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #ff6b00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Password</h2>
      <p class="description">Please enter your new password below.</p>

      <form
        id="resetPasswordForm"
        action="{{ url_for('reset_password', token=token) }}"
        method="POST"
      >
      {{ form.hidden_tag() }}
        <div class="form-group">
          <label for="new_password">New Password</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            required
          />
          <div class="password-requirements">
            <div class="requirement" id="length">• Minimum 8 characters</div>
            <div class="requirement" id="uppercase">
              • At least one uppercase letter
            </div>
            <div class="requirement" id="lowercase">
              • At least one lowercase letter
            </div>
            <div class="requirement" id="number">• At least one number</div>
            <div class="requirement" id="special">
              • At least one special character
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
          />
        </div>

        <button type="submit">Reset Password</button>
      </form>

      <div class="loading">
        <div class="spinner"></div>
      </div>

      <div id="message" class="message"></div>
    </div>

    <script>
      const form = document.getElementById("resetPasswordForm");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");
      const submitButton = form.querySelector('button[type="submit"]');

      const requirements = {
        length: (password) => password.length >= 8,
        uppercase: (password) => /[A-Z]/.test(password),
        lowercase: (password) => /[a-z]/.test(password),
        number: (password) => /[0-9]/.test(password),
        special: (password) => /[!@#$%^&*(),.?":{}|<>]/.test(password),
      };

      function validatePassword() {
        const pwd = password.value;
        let allValid = true;

        // Check each requirement
        for (const [requirement, validationFn] of Object.entries(
          requirements
        )) {
          const element = document.getElementById(requirement);
          const isValid = validationFn(pwd);
          element.className = `requirement ${isValid ? "valid" : "invalid"}`;
          allValid = allValid && isValid;
        }

        // Check if passwords match
        const passwordsMatch = password.value === confirmPassword.value;

        // Enable/disable submit button
        submitButton.disabled = !(allValid && passwordsMatch && password.value);
      }

      password.addEventListener("input", validatePassword);
      confirmPassword.addEventListener("input", validatePassword);

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const messageDiv = document.getElementById("message");
        const loadingDiv = document.querySelector(".loading");

        if (password.value !== confirmPassword.value) {
          showMessage("Passwords do not match", "error");
          return;
        }

        // Show loading state
        loadingDiv.style.display = "block";
        submitButton.disabled = true;
        messageDiv.style.display = "none";

        // Simulate API call
        setTimeout(() => {
          // This is where you would normally make an API call
          showMessage("Your password has been successfully reset", "success");
          loadingDiv.style.display = "none";
          submitButton.disabled = true;
          form.reset();
        }, 2000);
      });

      function showMessage(text, type) {
        const messageDiv = document.getElementById("message");
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = "block";
      }
    </script>
  </body>
</html>
