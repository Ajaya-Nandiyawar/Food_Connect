<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>NGO Event Scheduling</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/N-Events_schedule.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}" />
</head>
<body>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="logo">
        <img src={{url_for('static', filename='img/logo.ico')}} alt="FoodShare">
        <h1>Food<b style="background: linear-gradient(to right, #f57c00, #ffcc00); -webkit-background-clip: text; background-clip: text; color: transparent;">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <button class="toggle-btn" id="toggleBtn">X</button>
    </div>
    <div class="menu">
    <a href={{url_for('dashboard')}} class="menu-item" >
        <div class="icon dashboard-icon" onclick="openSidebar()"></div>
        <span class="menu-text">Dashboard</span>
    </a>
    <a href={{url_for('ngo.handle_request')}} class="menu-item">
        <div class="icon request-icon" onclick="openSidebar()"></div>
        <span class="menu-text">Requests</span>
    </a>
    <a href={{url_for('Events_schedule')}} class="menu-item active">
        <div class="icon event-icon" onclick="openSidebar()"></div>
        <span class="menu-text">Schedule Events</span>
    </a>
    <a href={{url_for('certification')}} class="menu-item">
      <div class="icon Approval-icon" onclick="openSidebar()"></div>
      <span class="menu-text">Certification</span>
    </a>
    <a href={{url_for('profile')}} class="menu-item">
        <div class="icon settings-icon" onclick="openSidebar()"></div>
        <span class="menu-text">Settings</span>
    </a>
  </div>
</div>

  <main class="main-content">
    <h1>Event Management</h1>
    <p>Schedule and manage your events</p>

    <div class="card">
      <h2>Create New Event</h2>
      <form id="eventForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <input type="text" id="eventName" name="name" placeholder="Event Name" required>
            <select id="focusArea" name="focus_area" required>
              <option value="">Select Focus Area</option>
              <option value="Education">Education</option>
              <option value="Health">Health</option>
              <option value="Environment">Environment</option>
              <option value="Poverty Alleviation">Poverty Alleviation</option>
            </select>
            <input type="number" id="volunteersNeeded" name="volunteers_needed"  placeholder="Volunteers Needed" required>
        </div>
        <div class="form-row">
            <div style="flex: 1; display: flex; flex-direction: column;">
              <p style="font-weight: 600;">Event Date</p>
              <input type="date" id="eventDate" name="event_date" required>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column;">
              <p style="font-weight: 600;">Starting Time</p>
              <input type="time" id="startTime" name="start_time" required>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column;">
              <p style="font-weight: 600;">Ending Time</p>
              <input type="time" id="endTime" name="end_time" required>
            </div>
          </div>
          
        <div class="form-row">
            <input type="text" id="eventLocation" name="location" placeholder="Location" required>
            <input type="tel" id="phoneNumber" name="phone_number" placeholder="Helpline Number"
            maxlength="10"
            pattern="\d{10}"
            title="Please enter a valid 10-digit number"
            required
            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"/>
        </div>
          
        <div class="form-row">
            <textarea id="eventDescription" placeholder="Event Description" name="description" required></textarea>
        </div>
          
        <div class="button-row">
            <button type="button" id="clearForm" class="btn red">Clear Form</button>
            <button type="submit" class="btn blue">Create Event</button>
        </div>
        <p id="warning" class="warning"></p>
      </form>
    </div>

    <div class="card">
      <h2>Scheduled Events</h2>
      <div id="eventsList"></div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3>Volunteer Applications</h3>
        <div class="status-tabs">
          <button class="status-tab active" data-status="Unapproved">Unapproved</button>
          <button class="status-tab" data-status="Approved">Approved</button>
          <button class="status-tab" data-status="Completed">Completed</button>
        </div>
      </div>
      <div class="modal-content" id="applicationsList">
        <!-- Volunteer cards will be inserted here -->
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()" class="btn blue">Close</button>
      </div>
    </div>

  </main>
</div>
<script src="{{ url_for('static', filename='js/sidebar.js')}}"></script>
<script src="{{ url_for('static', filename='js/N-Events_schedule.js')}}"></script>
</body>
</html>
