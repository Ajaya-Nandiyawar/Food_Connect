<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Notifications</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="logo" />
    <link rel="stylesheet" href={{url_for('static', filename='css/alert.css')}}>
    <link rel="stylesheet" href={{url_for('static', filename='css/sidebar.css')}}> 
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <img src={{url_for('static', filename='img/logo.ico')}} alt="FoodShare">
                <h1>Food<b style="color: rgb(239, 107, 13);">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button class="toggle-btn" id="toggleBtn">X</button>
            </div>
            <a href={{url_for('restaurant_dashboard')}} class="menu-item">
                <div class="icon dashboard-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Dashboard</span>
            </a>
            <!-- <a href={{url_for('restaurant_alerts')}} class="menu-item active">
                <div class="icon alert-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Notifications</span>
            </a> -->
            <a href={{url_for('restaurant_requests')}} class="menu-item">
                <div class="icon request-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Requests</span>
            </a>
            <a href={{url_for('restaurant.handle_donation')}} class="menu-item">
                <div class="icon donation-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Donations</span>
            </a>
            <a href={{url_for('restaurant_settings')}} class="menu-item">
                <div class="icon settings-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Settings</span>
            </a>
        </div>

        <main class="main-content">
            <header class="page-header">
                <h1>Notifications</h1>
                <p>Stay updated with your donation activities and requests</p>
            </header>

            <div class="notifications-header">
                <div class="notification-actions">
                    <button class="btn btn-link" onclick="markAllAsRead()">Mark all as read</button>
                    <button class="btn btn-link" onclick="clearAll()">Clear all</button>
                </div>
                <div class="notification-filter">
                    <label for="filterNotifications">Filter:</label>
                    <select id="filterNotifications" onchange="filterNotifications()">
                        <option value="all">All Notifications</option>
                        <option value="unread">Unread</option>
                        <option value="requests">Requests</option>
                        <option value="donations">Donations</option>
                        <option value="system">System</option>
                    </select>
                </div>
            </div>

            <div class="notifications-list" id="notificationsList">
                <!-- Notifications will be dynamically inserted here -->
            </div>

            <div class="pagination">
                <span class="pagination-info">Showing notifications</span>
                <div class="pagination-controls">
                    <button class="btn btn-link" disabled>Previous</button>
                    <button class="btn btn-page active">1</button>
                    <button class="btn btn-link">Next</button>
                </div>
            </div>
        </main>
    </div>
    <button class="scroll-to-top-button">
        <svg viewBox="0 0 384 512" class="svgIcon">
          <path
            d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"
          ></path>
        </svg>
      </button>
    <script src={{url_for('static',filename='js/alert.js')}}></script>
    <script src={{url_for('static',filename='js/sidebar.js')}}></script>
</body>
</html>
