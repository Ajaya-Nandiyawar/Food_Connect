<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Notifications</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="logo" />
    <link rel="stylesheet" href={{url_for('static', filename='css/alert.css')}}>
    <link rel="stylesheet" href={{url_for('static', filename='css/sidebar.css')}}> 
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <img src={{url_for('static', filename='img/logo.ico')}} alt="FoodShare">
                <h1>Food<b style="color: rgb(239, 107, 13);">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button class="toggle-btn" id="toggleBtn">X</button>
            </div>
            <a href={{url_for('restaurant_dashboard')}} class="menu-item">
                <div class="icon dashboard-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Dashboard</span>
            </a>
            <a href={{url_for('restaurant_alerts')}} class="menu-item active">
                <div class="icon alert-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Notifications</span>
            </a>
            <a href={{url_for('restaurant_requests')}} class="menu-item">
                <div class="icon request-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Requests</span>
            </a>
            <a href={{url_for('restaurant.handle_donation')}} class="menu-item">
                <div class="icon donation-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Donations</span>
            </a>
            <a href={{url_for('restaurant_settings')}} class="menu-item">
                <div class="icon settings-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Settings</span>
            </a>
        </div>

        <main class="main-content">
            <header class="page-header">
                <h1>Notifications</h1>
                <p>Stay updated with your donation activities and requests</p>
            </header>

            <div class="notifications-header">
                <div class="notification-actions">
                    <button class="btn btn-link" onclick="markAllAsRead()">Mark all as read</button>
                    <button class="btn btn-link" onclick="clearAll()">Clear all</button>
                </div>
                <div class="notification-filter">
                    <label for="filterNotifications">Filter:</label>
                    <select id="filterNotifications" onchange="filterNotifications()">
                        <option value="all">All Notifications</option>
                        <option value="unread">Unread</option>
                        <option value="requests">Requests</option>
                        <option value="donations">Donations</option>
                        <option value="system">System</option>
                    </select>
                </div>
            </div>

            <div class="notifications-list" id="notificationsList">
                <!-- Notifications will be dynamically inserted here -->
            </div>

            <div class="pagination">
                <span class="pagination-info">Showing notifications</span>
                <div class="pagination-controls">
                    <button class="btn btn-link" disabled>Previous</button>
                    <button class="btn btn-page active">1</button>
                    <button class="btn btn-link">Next</button>
                </div>
            </div>
        </main>
    </div>
    <script src={{url_for('static',filename='js/alert.js')}}></script>
    <script src={{url_for('static',filename='js/sidebar.js')}}></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchNotifications();
            setInterval(fetchNotifications, 10000); // Refresh every 10 seconds
        });

        function fetchNotifications() {
            fetch('/notifications/api/notifications')
                .then(response => {
                    if (!response.ok) throw new Error('Fetch failed');
                    return response.json();
                })
                .then(data => {
                    const list = document.getElementById('notificationsList');
                    list.innerHTML = ''; // Clear existing content

                    if (data.length === 0) {
                        list.innerHTML = '<p>No notifications available.</p>';
                    } else {
                        data.forEach(notif => {
                            const div = document.createElement('div');
                            div.className = 'notification-item unread';
                            div.innerHTML = `
                                <div class="notification-icon request">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>
                                </div>
                                <div class="notification-content">
                                    <div class="notification-header">
                                        <h3>${notif.message}</h3>
                                        <span class="notification-time">${new Date(notif.created_at).toLocaleString()}</span>
                                    </div>
                                    <p>Food Type: ${notif.food_type}, Quantity: ${notif.quantity}</p>
                                    <p>Note: ${notif.additional_note || 'None'}</p>
                                    <div class="notification-actions">
                                        <button class="btn-link" onclick="deleteNotification(${notif.id})">Delete</button>
                                    </div>
                                </div>
                            `;
                            list.appendChild(div);
                        });
                    }
                })
                .catch(error => console.error('Error fetching notifications:', error));
        }

        function deleteNotification(notificationId) {
            if (confirm("Are you sure you want to delete this notification?")) {
                fetch(`/notifications/api/notifications/delete/${notificationId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    }
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Delete failed');
                        return response.json();
                    })
                    .then(data => {
                        if (data.status === 'success') {
                            alert(data.message);
                            fetchNotifications(); // Refresh list
                        } else {
                            alert('Error: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting notification:', error);
                        alert('Failed to delete notification');
                    });
            }
        }

        function markAllAsRead() {
            alert('Mark all as read functionality not implemented yet.');
        }

        function clearAll() {
            alert('Clear all functionality not implemented yet.');
        }

        function filterNotifications() {
            alert('Filter functionality not implemented yet.');
        }
    </script>
</body>
</html>
