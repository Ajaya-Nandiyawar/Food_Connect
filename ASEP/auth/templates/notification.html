<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}"> <!-- Ensure CSRF token is included -->
    <title>FoodShare - Notifications</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="logo" />
    <link rel="stylesheet" href={{url_for('static', filename='css/notification.css')}}/>
    <link rel="stylesheet" href={{url_for('static', filename='css/sidebar.css')}}>
  </head>
  <body>
    <div class="container">
      <div class="sidebar" id="sidebar">
        <div class="logo">
            <img src={{url_for('static',filename='img/logo.ico')}} alt="FoodShare">
            <h1>Food<b style="background: linear-gradient(to right, #f57c00, #ffcc00); -webkit-background-clip: text; background-clip: text; color: transparent;">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <button class="toggle-btn" id="toggleBtn">X</button>
        </div>
        <div>
        <a href={{url_for('dashboard')}} class="menu-item ">
            <div class="icon dashboard-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Dashboard</span>
        </a>
        </div>
        <a href={{url_for('notifications')}} class="menu-item active">
            <div class="icon alert-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Notifications</span>
        </a>
        <a href={{url_for('ngo.handle_request')}} class="menu-item">
            <div class="icon request-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Requests</span>
        </a>
        <a href={{url_for('stat')}} class="menu-item">
            <div class="icon stats-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Stats</span>
        </a>
        <a href={{url_for('profile')}} class="menu-item">
            <div class="icon settings-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Settings</span>
        </a>
      </div>

      <div class="main-content">
        <div class="alert-banner">New Donation Scheduled</div>
        <div class="notifications-header">
          <h1>Notifications</h1>
          <div class="header-actions">
            <button class="mark-read" onclick="markAllAsRead()">Mark all as read</button>
            <div class="filter-dropdown">
              <select onchange="filterNotifications()">
                <option value="all">All notifications</option>
                <!-- Add more options if needed -->
              </select>
            </div>
          </div>
        </div>

        <div class="notifications-content" id="notificationsContent">
          <div class="section">
            <h2>Recent Notifications</h2>
            <!-- Notifications will be dynamically inserted here -->
          </div>
        </div>
      </div>
    </div>
    <script src={{url_for('static', filename='js/sidebar.js')}}></script>
    
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetchNotifications();
        setInterval(fetchNotifications, 10000); // Refresh every 10 seconds
      });

      function fetchNotifications() {
        fetch('/notifications/api/notifications')
          .then(response => {
            if (!response.ok) throw new Error('Fetch failed');
            return response.json();
          })
          .then(data => {
            const content = document.getElementById('notificationsContent');
            const section = content.querySelector('.section');
            section.innerHTML = '<h2>Recent Notifications</h2>';

            if (data.length === 0) {
              section.innerHTML += '<p>No notifications available.</p>';
            } else {
              data.forEach(notif => {
                const div = document.createElement('div');
                div.className = 'notification info';
                div.innerHTML = `
                  <div class="notification-icon">📅</div>
                  <div class="notification-content">
                    <div class="notification-header">
                      <h3>${notif.message}</h3>
                      <span class="time">${new Date(notif.created_at).toLocaleString()}</span>
                    </div>
                    <p>Food Type: ${notif.food_type}, Quantity: ${notif.quantity}</p>
                    <p>Note: ${notif.additional_note || 'None'}</p>
                    <button class="delete-btn" onclick="deleteNotification(${notif.id})">Delete</button>
                  </div>
                `;
                section.appendChild(div);
              });
            }
          })
          .catch(error => console.error('Error fetching notifications:', error));
      }

      function deleteNotification(notificationId) {
        if (confirm("Are you sure you want to delete this notification?")) {
          fetch(`/notifications/api/notifications/delete/${notificationId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
            }
          })
            .then(response => {
              if (!response.ok) throw new Error('Delete failed');
              return response.json();
            })
            .then(data => {
              if (data.status === 'success') {
                alert(data.message);
                fetchNotifications(); // Refresh list
              } else {
                alert('Error: ' + data.message);
              }
            })
            .catch(error => {
              console.error('Error deleting notification:', error);
              alert('Failed to delete notification');
            });
        }
      }

      function markAllAsRead() {
        alert('Mark all as read functionality not implemented yet.');
      }

      function filterNotifications() {
        alert('Filter functionality not implemented yet.');
      }
    </script>
  </body>
</html>
