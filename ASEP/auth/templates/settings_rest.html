<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="logo" />
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <img src="logo.ico" alt="FoodShare">
                <h1>Food<b style="color: rgb(239, 107, 13);">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button class="toggle-btn" id="toggleBtn">X</button>
            </div>
            <div>
            <a href="#" class="menu-item active">
                <div class="icon dashboard-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Dashboard</span>
            </a>
            </div>
            <a href="#" class="menu-item">
                <div class="icon alert-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Notifications</span>
            </a>
            <a href="#" class="menu-item">
                <div class="icon request-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Requests</span>
            </a>
            <a href="#" class="menu-item">
                <div class="icon stats-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Stats</span>
            </a>
            <a href="#" class="menu-item">
                <div class="icon settings-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Settings</span>
            </a>
        </div>
    
        <main class="main-content">
            <h1>Profile Settings</h1>
            <p class="subtitle">Manage your account information and preferences</p>

            <div class="settings-container">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-image">
                            <img src="https://via.placeholder.com/100" alt="Profile">
                            <button class="edit-image"><i class="material-icons">edit</i></button>
                        </div>
                        <div class="profile-info">
                            <h2>Restaurant Name</h2>
                            <p>restaurant@email.com</p>
                        </div>
                    </div>
                    <button class="logout-btn">Logout</button>
                </div>

                <form id="settings-form" class="settings-form">
                    <div class="form-section">
                        <h3>Basic Information</h3>
                        <div class="form-group">
                            <label>Organization Name</label>
                            <input type="text" value="Restaurant Name" required>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select required>
                                <option value="restaurant">Restaurant</option>
                                <option value="hotel">Hotel</option>
                                <option value="catering">Catering Service</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Contact Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" value="restaurant@email.com" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" value="+1 234 567 8900" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Location</h3>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" value="123 Restaurant Street" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" value="New York" required>
                            </div>
                            <div class="form-group">
                                <label>State</label>
                                <input type="text" value="NY" required>
                            </div>
                            <div class="form-group">
                                <label>ZIP Code</label>
                                <input type="text" value="10001" required>
                            </div>
                        </div>
                        <a href="#" class="map-link"><i class="material-icons">place</i> View on Maps</a>
                    </div>

                    <div class="form-section">
                        <h3>Notification Preferences</h3>
                        <div class="checkbox-group">
                            <label class="checkbox">
                                <input type="checkbox" checked>
                                <span>Email notifications for new requests</span>
                            </label>
                            <label class="checkbox">
                                <input type="checkbox" checked>
                                <span>SMS notifications for urgent requests</span>
                            </label>
                            <label class="checkbox">
                                <input type="checkbox">
                                <span>Weekly summary reports</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="cancel-btn">Cancel</button>
                        <button type="submit" class="save-btn">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="Profile Settings.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
