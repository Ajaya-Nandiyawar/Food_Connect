<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}" type="logo" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings_rest.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo.ico') }}" alt="FoodShare">
                <h1>Food<b style="color: rgb(239, 107, 13);">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button class="toggle-btn" id="toggleBtn">X</button>
            </div>
            <div>
            <a href={{url_for('restaurant_dashboard')}} class="menu-item active">
                <div class="icon dashboard-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Dashboard</span>
            </a>
            </div>
            <a href={{url_for('restaurant_alerts')}} class="menu-item">
                <div class="icon alert-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Notifications</span>
            </a>
            <a href={{url_for('restaurant_requests')}} class="menu-item">
                <div class="icon request-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Requests</span>
            </a>
            <a href={{url_for('restaurant.handle_donation')}} class="menu-item">
                <div class="icon stats-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Donations</span>
            </a>
            <a href={{url_for('restaurant_settings')}} class="menu-item">
                <div class="icon settings-icon" onclick="openSidebar()"></div>
                <span class="menu-text">Settings</span>
            </a>
        </div>
    
        <main class="main-content">
            <h1>Profile Settings</h1>
            <p class="subtitle">Manage your account information and preferences</p>

            <div class="settings-container">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-image">
                            <img src="https://e7.pngegg.com/pngimages/753/432/png-clipart-user-profile-2018-in-sight-user-conference-expo-business-default-business-angle-service.png" alt="Profile">
                        </div>
                        <div class="profile-info">
                            <h2>{{name}}</h2>
                            <p>{{email}}</p>
                        </div>
                    </div>
                    <a href="/logout">
                        <div class="parent">
                            <button class="btnlogout">Logout</button>
                        </div>
                    </a>
                </div>

                <form id="settings-form" class="settings-form">
                    <div class="form-section">
                        <h3>Basic Information</h3>
                        <div class="form-group">
                            <label>Organization Name</label>
                            <h3>{{name}}</h3>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <span class="badge rest">Restaurant</span>
                        <span class="badge verified">Verified</span>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Contact Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" value="restaurant@email.com" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" value="+1 234 567 8900" required>
                            </div>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="icon">📍</i>
                        <span id="userLocation">
                            <span class="loading-spinner"></span>
                            Fetching location...
                        </span>
                        <a id="locationLink" href="#" target="_blank" class="location-button" style="display: none;">
                            Open in Maps
                        </a>
                    </div>

                    <div class="form-section">
                        <h3>Notification Preferences</h3>
                        <div class="checkbox-group">
                            <label class="checkbox">
                                <input type="checkbox" checked>
                                <span>Email notifications for new requests</span>
                            </label>
                            <label class="checkbox">
                                <input type="checkbox" checked>
                                <span>SMS notifications for urgent requests</span>
                            </label>
                            <label class="checkbox">
                                <input type="checkbox">
                                <span>Weekly summary reports</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="cancel-btn">Cancel</button>
                        <button type="submit" class="save-btn">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src={{url_for('static', filename='js/settings_rest.js')}}></script>
    <script src={{url_for('static', filename='js/sidebar.js')}}></script>
</body>
</html>
