<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Overview</title>
    <link rel="stylesheet" href={{url_for('static', filename='css/sidebar.css')}}>
    <link rel="stylesheet" href={{url_for('static', filename='css/stats.css')}}>
    
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <img src={{url_for('static', filename='img/logo.ico')}} alt="FoodShare">
            <h1>Food<b style="background: linear-gradient(to right, #f57c00, #ffcc00); -webkit-background-clip: text; background-clip: text; color: transparent;">Connect</b></h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <button class="toggle-btn" id="toggleBtn">X</button>
        </div>
        <div>
        <a href={{url_for('dashboard')}} class="menu-item ">
            <div class="icon dashboard-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Dashboard</span>
        </a>
        </div>
        <a href={{url_for('notifications')}} class="menu-item">
            <div class="icon alert-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Notifications</span>
        </a>
        <a href={{url_for('ngo.handle_request')}} class="menu-item">
            <div class="icon request-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Requests</span>
        </a>
        <a href={{url_for('stat')}} class="menu-item active">
            <div class="icon stats-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Stats</span>
        </a>
        <a href={{url_for('profile')}} class="menu-item">
            <div class="icon settings-icon" onclick="openSidebar()"></div>
            <span class="menu-text">Settings</span>
        </a>
    </div>

    <main class="main-content">
        <header>
            <h1>Statistics Overview</h1>
            <select id="timeRange">
                <option>Last 7 Days</option>
                <option>Last 30 Days</option>
                <option>Last 3 Months</option>
            </select>
        </header>

        <div class="stats-cards">
            <div class="stat-card">
                <h3>Total Food Collected</h3>
                <div class="stat-value">12,450 kg</div>
                <div class="stat-change positive">↑ 1.23% vs last period</div>
            </div>
            <div class="stat-card">
                <h3>Active Locations</h3>
                <div class="stat-value">48</div>
                <div class="stat-change positive">↑ 4 new this week</div>
            </div>
            <div class="stat-card">
                <h3>Active Donors</h3>
                <div class="stat-value">156</div>
                <div class="stat-change positive">↑ 12 new this week</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <h2>Weekly Food Collection</h2>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-box">
                <h2>Distribution by Category</h2>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src={{url_for('static', filename='js/stats.js')}}></script>
    <script src={{url_for('static', filename='js/sidebar.js')}}></script>
</body>
</html>
