<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Partner.css">
</head>
<body>
    <section class="ngo-section">
        <div class="section-header">
          <h2>NGO Partners Making a Difference</h2>
          <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="children">Children</button>
            <button class="filter-btn" data-filter="elderly">Elderly</button>
            <button class="filter-btn" data-filter="community">Community</button>
            <button class="filter-btn" data-filter="education">Education</button>
          </div>
        </div>
      
        <div class="ngo-stats">
          <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-value">320K+</div>
            <div class="stat-label">People Served</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🏢</div>
            <div class="stat-value">155</div>
            <div class="stat-label">Centers</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🚛</div>
            <div class="stat-value">32</div>
            <div class="stat-label">Delivery Vehicles</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🍱</div>
            <div class="stat-value">1.5M+</div>
            <div class="stat-label">Meals Delivered</div>
          </div>
        </div>
      
        <div class="ngo-grid">
          <!-- Previous NGO cards structure remains, adding category data attribute -->
          <div class="ngo-card" data-category="children">
            <!-- Previous card content -->
          </div>
          <!-- Add data-category to other cards -->
        </div>
      </section>
          
      <script src="Partner.js"></script>
</body>
</html>
